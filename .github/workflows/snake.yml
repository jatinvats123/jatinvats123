# Draws the contribution "snake" (lime on olive) and publishes it to the `output` branch,
# which the README links to. Runs daily and on demand.
name: contribution snake
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#282c20&color_dots=#ebedf0,#e6f5a8,#c8ec5a,#a3cf1c,#6f8f00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d2ff00&color_dots=#161b22,#3a4020,#5c6b1f,#8fae17,#d2ff00
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
